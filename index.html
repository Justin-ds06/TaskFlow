<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <header class="topbar">
    <button id="menuBtn" class="icon-btn menu-only" aria-label="Show or hide filters">☰</button>
    <h1>TaskFlow</h1>
    <input id="searchInput" type="search" placeholder="Search tasks…" aria-label="Search tasks">
    <button id="addBtn" class="btn primary">Add task</button>
    <button id="themeBtn" class="icon-btn" aria-label="Switch light or dark theme">◐</button>
  </header>

  <div class="layout">


    <aside id="sidebar" class="sidebar">
      <fieldset>
        <legend>Status</legend>
        <label><input type="radio" name="status" value="all" checked> All</label>
        <label><input type="radio" name="status" value="active"> Active</label>
        <label><input type="radio" name="status" value="completed"> Completed</label>
      </fieldset>

      <label>Category
        <select id="filterCategory">
          <option value="all">All categories</option>
          <option>School</option><option>Work</option><option>Personal</option><option>Home</option>
        </select>
      </label>

      <label>Priority
        <select id="filterPriority">
          <option value="all">All priorities</option>
          <option>High</option><option>Medium</option><option>Low</option>
        </select>
      </label>

      <label>Sort by
        <select id="sortBy">
          <option value="created">Newest first</option>
          <option value="due">Due date</option>
          <option value="priority">Priority</option>
        </select>
      </label>

      <div class="backup">
        <button id="exportBtn" class="btn">Export backup</button>
        <button id="importBtn" class="btn">Import backup</button>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </div>
    </aside>


    <main>
      <section class="stats" aria-label="Progress">
        <div class="stat"><span id="statTotal">0</span> Total</div>
        <div class="stat"><span id="statDone">0</span> Completed</div>
        <div class="stat overdue"><span id="statOverdue">0</span> Overdue</div>
        <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
      </section>

      <ul id="taskList" class="task-list"></ul>
      <p id="emptyMessage" class="empty" hidden></p>
    </main>
  </div>

  <button id="fabAdd" class="fab menu-only" aria-label="Add task">+</button>

  
  <dialog id="taskDialog">
    <form id="taskForm" novalidate>
      <h2 id="dialogTitle">Add task</h2>
      <input type="hidden" id="taskId">

      <label>Title
        <input id="title" maxlength="80" autocomplete="off">
        <span class="error" id="titleError"></span>
      </label>

      <label>Description (optional)
        <textarea id="description" rows="3"></textarea>
        <span class="error" id="descriptionError"></span>
      </label>

      <label>Due date (optional)
        <input id="dueDate" type="date">
        <span class="error" id="dueDateError"></span>
      </label>

      <div class="row">
        <label>Priority
          <select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select>
        </label>
        <label>Category
          <select id="category"><option>School</option><option>Work</option><option>Personal</option><option>Home</option></select>
        </label>
      </div>

      <div class="row actions">
        <button type="button" id="cancelBtn" class="btn">Cancel</button>
        <button type="submit" class="btn primary">Save task</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
