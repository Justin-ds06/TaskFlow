<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">


    <header class="app-header">
      <h1>TaskFlow</h1>
      <button id="themeBtn" class="btn">Theme toggle</button>
    </header>


    <section class="stats" aria-label="Progress">
      <div class="stat"><strong id="statTotal">0</strong>Total</div>
      <div class="stat"><strong id="statDone">0</strong>Done</div>
      <div class="stat"><strong id="statOverdue">0</strong>Overdue</div>
    </section>
    <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>


    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="Search tasks…" aria-label="Search tasks">
      <button id="addBtn" class="btn">+ Add task</button>
    </div>


    <div class="chips">
      <button class="chip" data-filter="status" title="Click to change">Status: All</button>
      <button class="chip" data-filter="priority" title="Click to change">Priority: All</button>
      <button class="chip" data-filter="category" title="Click to change">Category: All</button>
      <button class="chip" data-filter="sort" title="Click to change">Sort: Due date</button>
    </div>


    <ul id="taskList" class="task-list"></ul>
    <p id="emptyMessage" class="empty" hidden></p>


    <footer class="app-footer">
      <button id="exportBtn" class="btn">Export JSON</button>
      <button id="importBtn" class="btn">Import</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </footer>

  </div>


  <dialog id="taskDialog">
    <form id="taskForm" novalidate>
      <h2 id="dialogTitle">Add task</h2>
      <input type="hidden" id="taskId">

      <label>Title (required)
        <input id="title" maxlength="80" placeholder="Enter a title" autocomplete="off">
        <span class="error" id="titleError"></span>
      </label>

      <label>Description
        <textarea id="description" rows="3" placeholder="Details"></textarea>
        <span class="error" id="descriptionError"></span>
      </label>

      <label>Category
        <select id="category">
          <option value="">Select category</option>
          <option>School</option><option>Work</option><option>Personal</option><option>Home</option>
        </select>
        <span class="error" id="categoryError"></span>
      </label>

      <div class="row">
        <label>Priority
          <select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select>
        </label>
        <label>Due date
          <input id="dueDate" type="date">
          <span class="error" id="dueDateError"></span>
        </label>
      </div>

      <div class="row actions">
        <button type="button" id="cancelBtn" class="btn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
